# Local hooks: ruff (lint) + gitleaks (secrets).
# Enable once: pip install pre-commit && pre-commit install
# See CONTRIBUTING.md.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
