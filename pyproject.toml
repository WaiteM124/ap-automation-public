[project]
name = "ap-automation"
version = "0.2.0"
description = "Self-learning AP automation POC - non-PO invoice GL coding via RAG, a governed confidence gate, and a human-in-the-loop write-back"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.36.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "google-auth>=2.30.0",
    "google-api-python-client>=2.130.0",
    "langfuse>=2.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ap_automation*"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is not enforced by a formatter here

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:qdrant_client"]
